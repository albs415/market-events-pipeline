name: QQQ Reversal Engine CI

on:
  push:
    paths:
      - "qqq-reversal-engine/**"
      - ".github/workflows/qqq-reversal-engine.yml"
  pull_request:
    paths:
      - "qqq-reversal-engine/**"
      - ".github/workflows/qqq-reversal-engine.yml"

permissions:
  contents: read
  packages: write

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qqq-reversal-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: qqq-reversal-engine/pyproject.toml
      - name: Install
        run: pip install .
      - name: Syntax smoke test
        run: python -m compileall app
      - name: Build container
        run: docker build -t qqq-reversal-engine:${{ github.sha }} .
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: qqq-reversal-engine
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qqq-reversal-engine:latest
            ghcr.io/${{ github.repository_owner }}/qqq-reversal-engine:${{ github.sha }}
